<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2430" />
      <stop offset="100%" stop-color="#10161F" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EE5B9" />
      <stop offset="100%" stop-color="#4DD0A7" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-15%" width="116%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#4DD0A7" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Button Card -->
  <rect x="2" y="2" width="276" height="60" rx="14" fill="url(#btnBg)" stroke="url(#mintGrad)" stroke-width="1.8" filter="url(#shadow)" />

  <!-- Android/Download Icon -->
  <g transform="translate(18, 16)">
    <!-- Download Arrow + Base -->
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#4DD0A7" fill-opacity="0.15" />
    <path d="M16 8V20M16 20L11 15M16 20L21 15" stroke="#4DD0A7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 24H23" stroke="#4DD0A7" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Text Hierarchy -->
  <text x="64" y="27" fill="#8E9FA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.08em" text-transform="uppercase">DIRECT GITHUB RELEASE</text>
  <text x="64" y="47" fill="#F3F6F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.01em">Download APK</text>

  <!-- Chevron Icon -->
  <path d="M256 32L249 26M256 32L249 38" stroke="#4DD0A7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
