name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean Local Properties
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          
          # Find the generated APK
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          
          RELEASE_APK="CatGuard-${TAG_NAME}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          
          # Generate SHA-256 Checksum
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV
          echo "CHECKSUM_FILE=${RELEASE_APK}.sha256" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CatGuard ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.CHECKSUM_FILE }}
