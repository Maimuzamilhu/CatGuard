name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        # If release keystore is absent, assembleRelease produces an unsigned APK or assembleDebug can be packaged
        run: |
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          
          # Find the generated APK
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_APK="CatGuard-${TAG_NAME}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          
          # Generate SHA-256 Checksum
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV
          echo "CHECKSUM_FILE=${RELEASE_APK}.sha256" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CatGuard ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.CHECKSUM_FILE }}
